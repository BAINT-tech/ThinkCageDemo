<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ThinkCage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="logo">🧠 ThinkCage</div>
    <select class="language" id="languageSelect">
      <option value="pidgin">🇳🇬 Pidgin</option>
      <option value="english">🇬🇧 English</option>
    </select>
  </header>

  <!-- CHAT AREA -->
  <main class="chat-area" id="chatArea"></main>

  <!-- INPUT -->
  <footer class="input-bar">
    <button class="mic-btn" id="micBtn" onclick="startMic()">🎤</button>
    <input id="userInput" type="text" placeholder="Type or speak..." />
    <button onclick="sendMessage()">➤</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
